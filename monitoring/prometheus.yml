global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    project: datathon-grupo-75
    phase: fase-05

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: datathon-api
    metrics_path: /metrics
    static_configs:
      - targets: ["api:8000"]
        labels:
          service: api
          team: grupo-75
