[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "datathon-7mlet-grupo-75"
version = "0.1.0"
description = "Desafio Datathon da Pós em Machine Learning Engineering da FIAP."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pandas>=2.0.0",
    "numpy>=1.24.0",
    "scikit-learn>=1.3.0",
    "fastapi>=0.100.0",
    "uvicorn>=0.23.0",
    "mlflow>=2.5.0",
    "pydantic>=2.0.0",
    "seaborn>=0.12.0",
    "matplotlib>=3.7.0",
    "jupyter>=1.0.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "ruff>=0.0.280",
    "black>=23.7.0",
    "pre-commit>=3.3.3"
]

[tool.ruff]
line-length = 88

[tool.pytest.ini_options]
testpaths = ["tests"]